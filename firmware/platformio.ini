; PlatformIO Project Configuration File
;
; Fluidics Controller - Teensy 4.1
;

[platformio]
; Source files are in the project root (not src/)
src_dir = .
; A bare `pio run` (what CI runs) builds the two Teensy targets. The native
; env exists only for `pio test -e native` and cannot compile the sketch.
default_envs = teensy41, teensy41_v4s

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; src_dir is the project root, so keep the native tests out of the sketch.
build_src_filter = +<*> -<.git/> -<.svn/> -<test/>

; Serial monitor
monitor_speed = 2000000

; Library dependencies
lib_deps =
    bakercp/PacketSerial@^1.4.0

; Upload protocol (default is teensy-cli)
; upload_protocol = teensy-cli

; FLUIDICS V4 SIMPLE board: I2C only -- selector valves, flow sensors on
; J15/J17/J20. Commands for hardware it does not have reply CMD_INVALID.
[env:teensy41_v4s]
extends = env:teensy41
build_flags = -D BOARD_V4S

; Host-side unit tests of bus_rules.h.
[env:native]
platform = native
test_framework = unity
