[build-system]
# >=64: first setuptools with PEP 660 editable installs (pip install -e).
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "squid-fluidics"
version = "2.0.0"
description = "Control software for the Fluidics v2 liquid-handling system (Squid)"
requires-python = ">=3.10"
dependencies = [
    "cobs",
    "numpy",
    "pandas",
    "platformdirs",
    "pydantic>=2,<3",
    "pyserial",
    "pyyaml",
    "ruamel.yaml",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15", "qtpy", "matplotlib"]
# The unit suite imports the gui modules, so [test] pulls [gui] along
# (self-referential extras resolve against the local project on every pip
# that can install it editable at all).
test = ["pytest", "squid-fluidics[gui]"]

# The fluidics package (fluidics.qt included, which needs the `gui` extra) is
# importable; gui.py and run_sequences.py stay top-level entry scripts run from
# this directory (console-script entry points are a later change).
[tool.setuptools.packages.find]
include = ["fluidics*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
