# A plate-sipper rig (2026-10-22): one 10-port valve, the sipper on port 1,
# five bottles on ports 2-6, an XYG321-A stage (X1, Y2, Z3 on one RS-485
# adapter) over two 96-well plates. The serial numbers are this rig's: give
# yours. probes is taught; ssct's A1 and dip depth are still placeholders.
config_version: '2.0'
microcontroller:
  serial_number: '20021310'
syringe_pump:
  serial_number: A9DVHMOCA
  volume_ul: 5000
  ports_allowed:
  - 1
  - 2
  - 3
  waste_port: 1
  extract_port: 2
  dispense_port: null
  speed_code_limit: 10
reagent_selection:
  selector_valves:
    valve_ids:
    - 0
    number_of_ports:
      0: 10
    tubing_fluid_amount_to_valve_ul:
      0: 0
    name_mapping:
      port_1: sipper
      port_2: wash buffer 1
      port_3: 4x SSC
      port_4: DAPI
      port_5: anti-bleaching buffer
      port_6: wash buffer 2
    tubing_fluid_amount_ul:     # reagent (or sipper tip) to the valve; ports without an entry are not offered
      port_1: 460
      port_2: 200
      port_3: 220
      port_4: 240
      port_5: 240
      port_6: 410
    # A bottle with a loaded volume is volume tracked (set it here or in the
    # Reservoirs window); the others are counted, not limited.
    loaded_volume_ul:
      port_4: 2000
      port_5: 5000
  common_tubing_fluid_amount_ul: 310   # valve to flow cell
  nimotion_gantry_system:
    selector_valve_port: 1
    push_volume_ul: 710       # measured; what a push row draws
    serial_number: A10PIMTHA  # the RS-485 adapter's; or give port: COMn instead
    baudrate: 115200
    axes: {x: X1, y: Y2, z: Z3}
    travel_z_mm: 7.2          # taught: Z rises to this before any XY move (0 is the top, 1 mm the floor)
    xy_velocity_mm_s: 50
    z_velocity_mm_s: 20
    homing_velocity_mm_s: 20  # the switch search: twice the driver's 10 mm/s
    homing_acceleration_mm_s2: 200  # at 200 mm/s^2 an axis runs about v^2/2a = 1 mm past its switch before it reverses
    default_reservoir: probes
    # Plates side by side along X, long sides along Y: columns run along +y,
    # rows along +x. A1, dip depth and travel height are taught on the Robot tab.
    reservoirs:
      1:
        name: probes
        type: plate
        number_of_wells: 96
        a1_xy_mm: [8.8, 1.3]    # taught 2026-10-22
        dip_z_mm: 54.2
        column_axis: "+y"
        row_axis: "+x"
        loaded_ul: 350          # what a well holds when loaded; set to what you load
      2:
        name: ssct
        type: plate
        number_of_wells: 96
        a1_xy_mm: [102.5, 1.5]  # placeholder: teach A1 and the dip depth
        dip_z_mm: 50.0
        column_axis: "+y"
        row_axis: "+x"
        loaded_ul: 1800
    priming_well: ssct/H11    # keep these two wells full and out of sequences
    clean_up_well: ssct/H12
    agitate_amplitude_mm: 5.0
flow_sensors:
- index: 1
  name: syringe_draw
  monitor: "off"              # off, warn or stop; switchable on the Flow Sensors tab
application: Flow Cell
