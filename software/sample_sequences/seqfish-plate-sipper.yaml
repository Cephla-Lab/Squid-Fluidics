# Two seqFISH+ rounds on the plate-sipper rig (spec section 6). Port 1 is the
# sipper; plate 1 (probes) holds one hyb mix per round (A1 for R01, A2 for
# R02), plate 2 (ssct) the paired 4x SSCT well at the same position. Volumes
# are from sample_config/plate_sipper_config.yaml.
# - hyb draws 100 uL into the sipper's line, and the push row then draws the
#   config's push_volume_ul from the paired ssct well (490: the tip-to-flow-
#   cell volume, 250 + 240), which puts the hyb in the cell for push's
#   20-minute incubation. A push row names its well and flow rate, nothing
#   else.
# - ssct washes 1000 uL through from the same well. A row that draws from a
#   well cannot fill tubing, so hyb, push and ssct have no fill.
# - Every bottle row fills its tubing with 4x SSC (port 25) after its draw:
#   580 uL, valve 2 to the cell (340 + 240), so the row's whole volume passes
#   through the cell and the line is left holding 4x SSC. dapi's 300 uL would
#   not reach the cell without it; on the 4x SSC and rinse rows the fill is
#   580 uL more of the same buffer.
sequences:
  - {type: priming,      round: setup, fluidic_port: 25, flow_rate: 5000, volume: 800}

  - {type: flow_reagent, round: R01, name: hyb,         fluidic_port: 1,  well: A1,      flow_rate: 2000, volume: 100}
  - {type: push,         round: R01, name: push,        well: ssct/A1, flow_rate: 2000, incubation_time: 20}
  - {type: flow_reagent, round: R01, name: ssct,        fluidic_port: 1,  well: ssct/A1, flow_rate: 5000, volume: 1000, dip_cycles: 3}
  - {type: flow_reagent, round: R01, name: wash 12.5%,  fluidic_port: 24, flow_rate: 5000, volume: 1000, fill_tubing_with: 25}
  - {type: flow_reagent, round: R01, name: 4x SSC,      fluidic_port: 25, flow_rate: 5000, volume: 1000, fill_tubing_with: 25}
  - {type: flow_reagent, round: R01, name: dapi,        fluidic_port: 26, flow_rate: 5000, volume: 300,  fill_tubing_with: 25, incubation_time: 0.5}
  - {type: flow_reagent, round: R01, name: anti-bleach, fluidic_port: 27, flow_rate: 5000, volume: 1000, fill_tubing_with: 25}
  - {type: flow_reagent, round: R01, name: strip 55%,   fluidic_port: 28, flow_rate: 1000, volume: 1000, fill_tubing_with: 25, incubation_time: 1}
  - {type: flow_reagent, round: R01, name: rinse,       fluidic_port: 25, flow_rate: 5000, volume: 1000, fill_tubing_with: 25}

  - {type: flow_reagent, round: R02, name: hyb,         fluidic_port: 1,  well: A2,      flow_rate: 2000, volume: 100}
  - {type: push,         round: R02, name: push,        well: ssct/A2, flow_rate: 2000, incubation_time: 20}
  - {type: flow_reagent, round: R02, name: ssct,        fluidic_port: 1,  well: ssct/A2, flow_rate: 5000, volume: 1000, dip_cycles: 3}
  - {type: flow_reagent, round: R02, name: wash 12.5%,  fluidic_port: 24, flow_rate: 5000, volume: 1000, fill_tubing_with: 25}
  - {type: flow_reagent, round: R02, name: 4x SSC,      fluidic_port: 25, flow_rate: 5000, volume: 1000, fill_tubing_with: 25}
  - {type: flow_reagent, round: R02, name: dapi,        fluidic_port: 26, flow_rate: 5000, volume: 300,  fill_tubing_with: 25, incubation_time: 0.5}
  - {type: flow_reagent, round: R02, name: anti-bleach, fluidic_port: 27, flow_rate: 5000, volume: 1000, fill_tubing_with: 25}
  - {type: flow_reagent, round: R02, name: strip 55%,   fluidic_port: 28, flow_rate: 1000, volume: 1000, fill_tubing_with: 25, incubation_time: 1}
  - {type: flow_reagent, round: R02, name: rinse,       fluidic_port: 25, flow_rate: 5000, volume: 1000, fill_tubing_with: 25}
