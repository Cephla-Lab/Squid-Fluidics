# Minimal sequence to verify temperature controller integration in Flow Cell mode.
# Cycles through three set_temperature targets with one flow_reagent step in between
# so both the temperature dispatch and fluidic dispatch are exercised.
#
# Adjust ports / temperatures as appropriate for your setup.
sequences:
  - type: set_temperature
    temperature: 30

  - type: flow_reagent
    fluidic_port: 10
    flow_rate: 5000
    volume: 200

  - type: set_temperature
    temperature: 60
    incubation_time: 0.5

  - type: flow_reagent
    fluidic_port: 10
    flow_rate: 5000
    volume: 200

  - type: set_temperature
    temperature: 30
