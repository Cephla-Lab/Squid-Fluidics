name: CI

on:
  push:
    branches: [main]
  pull_request:

# These jobs execute pull-request code (pip install, pytest, pio run), so the
# token they can reach must not be able to write anything.
permissions:
  contents: read

# A superseded push has nothing left to prove; stop paying for its run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      # Nothing here needs git after checkout; don't leave the token in
      # .git/config for the PR code these jobs run.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          # Matches the Python on the rigs.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: software/pyproject.toml

      # PyQt5 wheels bundle Qt itself but link against these system
      # libraries; the offscreen platform needs no display beyond them.
      - name: Install Qt runtime libraries
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libgl1 libegl1 libxkbcommon0 libdbus-1-3
      - name: Install package and test dependencies
        run: pip install -e .[test]

      # No QT_QPA_PLATFORM here: tests/conftest.py forces Qt's offscreen
      # platform itself, so CI proves the same setup a headless dev box uses.
      - name: Run tests
        run: python -m pytest -q

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      # Nothing here needs git after checkout; don't leave the token in
      # .git/config for the PR code these jobs run.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Teensy toolchain and framework are a large one-time download.
      # restore-keys lets an edited platformio.ini start from the old cache
      # instead of a cold re-download. PlatformIO itself runs fine on the
      # runner's preinstalled Python.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run
        working-directory: firmware
