name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  software-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Python on the rigs.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: software/pyproject.toml

      # PyQt5 wheels bundle Qt itself but link against these system
      # libraries; the offscreen platform needs no display beyond them.
      - name: Install Qt runtime libraries
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libgl1 libegl1 libxkbcommon0 libdbus-1-3
      - name: Install package and test dependencies
        run: pip install -e .[test]

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Teensy toolchain and framework are a large one-time download.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run
        working-directory: firmware
